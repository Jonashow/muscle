<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUSCLE 360</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,sans-serif;background:#071018;color:#edf5f8}
#m360{height:760px;position:relative;background:radial-gradient(circle at 50% 35%,#18333f,#060e15 68%);border-radius:14px;overflow:hidden}
#m360 canvas{display:block;width:100%;height:100%}
.m360top{position:absolute;left:0;right:0;top:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#08131be8;border-bottom:1px solid #243641;z-index:5}
.m360logo{font-weight:900;letter-spacing:.1em}.m360logo span{color:#35d0ba}.m360status{font-size:11px;color:#9ab0ba}
.m360panel{position:absolute;top:58px;bottom:0;width:220px;background:#09151ee8;padding:14px;z-index:4}
.m360left{left:0;border-right:1px solid #243641}.m360right{right:0;width:260px;border-left:1px solid #243641}
.m360panel h3{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#9bb0ba;margin:0 0 9px}
.m360panel button{width:100%;padding:9px;background:#10202a;color:#eef5f7;border:1px solid #29404b;border-radius:8px;margin:3px 0;text-align:left;cursor:pointer}
.m360panel button.active,.m360panel button:hover{background:#102d2d;border-color:#35a99c}
.m360name{font-size:21px;font-weight:800;margin:5px 0}.m360tag{display:inline-block;font-size:10px;color:#35d0ba;border:1px solid #27675f;border-radius:99px;padding:4px 7px}.m360desc{font-size:12px;line-height:1.5;color:#aac0c8;margin-top:10px}
.m360row{display:flex;justify-content:space-between;border-top:1px solid #223540;padding:9px 0;font-size:11px;color:#8ea5af}.m360row b{color:#eef5f7}
.m360hint{position:absolute;left:50%;bottom:11px;transform:translateX(-50%);background:#071018dd;border:1px solid #29404b;border-radius:20px;padding:7px 11px;font-size:10px;color:#a9bbc2;z-index:5;white-space:nowrap;pointer-events:none}
.m360error{position:absolute;inset:58px 0 0;display:none;align-items:center;justify-content:center;color:#ffb7ae;text-align:center;padding:30px;z-index:10}
@media(max-width:900px){.m360left{width:180px}.m360right{display:none}}
@media(max-width:600px){#m360{height:680px}.m360left{display:none}}
</style>
</head>
<body>
<div id="m360">
<div class="m360top"><div class="m360logo">MUSCLE <span>360</span></div><div class="m360status">MODELO 3D PERSONAL</div></div>
<div class="m360panel m360left">
<h3>Vista</h3>
<button data-v="front" class="active">Frontal</button><button data-v="back">Posterior</button><button data-v="left">Lateral izquierda</button><button data-v="right">Lateral derecha</button><button id="reset">Restablecer</button>
<div style="height:14px"></div><h3>Capas</h3>
<label style="font-size:11px;color:#a4bac3;display:block;margin:8px 0"><input id="zones" type="checkbox" checked> Mapa muscular</label>
<label style="font-size:11px;color:#a4bac3;display:block;margin:8px 0"><input id="wire" type="checkbox"> Malla 3D</label>
<p style="font-size:10px;line-height:1.45;color:#8198a3">Este modelo procede del archivo 3D generado a partir de la fotografía que aportaste.</p>
</div>
<div class="m360panel m360right">
<h3>Selección</h3><div id="mname" class="m360name">Tu amigo</div><span id="mtag" class="m360tag" style="display:none"></span>
<div id="mdesc" class="m360desc">Arrastra el modelo para girarlo. Activa el mapa muscular y pulsa una zona.</div>
<div id="mrows"></div>
</div>
<div class="m360hint">Arrastra para girar · rueda para zoom · clic para seleccionar</div>
<div id="merror" class="m360error"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.161/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.161/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
var stage=document.getElementById('m360');
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(32,stage.clientWidth/stage.clientHeight,.01,100);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(stage.clientWidth,stage.clientHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
var controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.minDistance=1.2; controls.maxDistance=7; controls.target.set(0,0,0);
scene.add(new THREE.HemisphereLight(0xdff5ff,0x18252d,2.3));
var key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(3,5,5);scene.add(key);
var fill=new THREE.DirectionalLight(0x77d8ff,1.3);fill.position.set(-4,2,-3);scene.add(fill);

var model=null, zones=[], selected=null, zoneGroup=new THREE.Group(); scene.add(zoneGroup);
var muscleMat=new THREE.MeshStandardMaterial({color:0xb63f38,transparent:true,opacity:.68,roughness:.55});
var hitMat=new THREE.MeshStandardMaterial({color:0xff6a59,emissive:0x4d100d,emissiveIntensity:.65,transparent:true,opacity:.9});
var ray=new THREE.Raycaster(), mouse=new THREE.Vector2();

function zone(name,region,desc,scale,pos){
 var z=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),muscleMat.clone());
 z.scale.set(scale[0],scale[1],scale[2]); z.position.set(pos[0],pos[1],pos[2]);
 z.userData={name:name,region:region,desc:desc}; zoneGroup.add(z); zones.push(z);
}
function makeZones(){
 var box=new THREE.Box3().setFromObject(model), min=box.min,max=box.max;
 var w=max.x-min.x,h=max.y-min.y,d=max.z-min.z;
 // Approximate interactive anatomical regions placed around the personal body.
 zone('Pectoral mayor','Pecho','Aducción y rotación interna del brazo; participa en la flexión horizontal.',[w*.30,h*.10,d*.07],[(min.x+max.x)/2,min.y+h*.73,min.z+d*.94]);
 zone('Deltoides','Hombro','Eleva y estabiliza el brazo.',[w*.12,h*.15,d*.07],[min.x+w*.26,min.y+h*.76,min.z+d*.84]);
 zone('Bíceps braquial','Brazo','Flexiona el codo y ayuda a supinar el antebrazo.',[w*.09,h*.19,d*.06],[min.x+w*.27,min.y+h*.59,min.z+d*.88]);
 zone('Recto abdominal','Core','Flexiona el tronco y contribuye a la estabilidad.',[w*.16,h*.28,d*.055],[(min.x+max.x)/2,min.y+h*.56,min.z+d*.94]);
 zone('Oblicuo externo','Core','Rotación y flexión lateral del tronco.',[w*.12,h*.23,d*.055],[min.x+w*.34,min.y+h*.55,min.z+d*.89]);
 zone('Cuádriceps','Muslo','Extensión de la rodilla.',[w*.15,h*.30,d*.06],[min.x+w*.39,min.y+h*.29,min.z+d*.87]);
 zone('Trapecio','Espalda','Movimiento y estabilización de la escápula.',[w*.24,h*.22,d*.06],[(min.x+max.x)/2,min.y+h*.75,min.z+d*.08]);
 zone('Dorsal ancho','Espalda','Extensión y aducción del hombro.',[w*.32,h*.28,d*.06],[(min.x+max.x)/2,min.y+h*.57,min.z+d*.07]);
 zone('Tríceps braquial','Brazo','Principal extensor del codo.',[w*.09,h*.21,d*.06],[min.x+w*.73,min.y+h*.59,min.z+d*.12]);
 zone('Glúteo mayor','Cadera','Potente extensor de cadera.',[w*.28,h*.18,d*.065],[(min.x+max.x)/2,min.y+h*.33,min.z+d*.08]);
 zone('Isquiotibiales','Muslo posterior','Flexionan la rodilla y extienden la cadera.',[w*.15,h*.28,d*.06],[min.x+w*.62,min.y+h*.29,min.z+d*.12]);
 zone('Gemelos','Pantorrilla','Contribuyen a la flexión plantar del tobillo.',[w*.11,h*.25,d*.06],[min.x+w*.62,min.y+h*.11,min.z+d*.15]);
 zoneGroup.visible=document.getElementById('zones').checked;
}
function loaded(g){
 model=g.scene;
 // Center and normalize the personal model.
 var box=new THREE.Box3().setFromObject(model);
 var c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3());
 model.position.sub(c);
 var maxDim=Math.max(s.x,s.y,s.z);
 var scale=2.7/maxDim;
 model.scale.setScalar(scale);
 scene.add(model);
 model.traverse(function(o){if(o.isMesh&&o.material)o.material=o.material.clone()});
 camera.position.set(0,0.2,4.2);controls.target.set(0,0,0);controls.update();
 makeZones();
}
var glb='person_0.glb';
try{
 new THREE.GLTFLoader().load(glb, loaded, undefined, function(e){
  document.getElementById('merror').style.display='flex';
  document.getElementById('merror').innerHTML='No se pudo cargar el modelo 3D.<br>Comprueba que person_0.glb está publicado junto a esta página.';
 });
}catch(e){
 document.getElementById('merror').style.display='flex';
 document.getElementById('merror').textContent='Error al iniciar el visor: '+e.message;
}

renderer.domElement.addEventListener('pointerdown',function(e){
 var r=renderer.domElement.getBoundingClientRect();
 mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;
 ray.setFromCamera(mouse,camera);
 var hit=ray.intersectObjects(zones,false)[0];
 if(hit){if(selected)selected.material=muscleMat.clone();selected=hit.object;selected.material=hitMat.clone();
 document.getElementById('mname').textContent=selected.userData.name;document.getElementById('mtag').textContent=selected.userData.region;document.getElementById('mtag').style.display='inline-block';document.getElementById('mdesc').textContent=selected.userData.desc;document.getElementById('mrows').innerHTML='<div class="m360row"><span>Modelo</span><b>Personal 3D</b></div><div class="m360row"><span>Selección</span><b>360°</b></div>';
 }
});
function view(v){
 var d=4.2,p={front:[0,.15,d],back:[0,.15,-d],left:[-d,.15,0],right:[d,.15,0]}[v];
 camera.position.set(p[0],p[1],p[2]);controls.target.set(0,0,0);controls.update();
 Array.prototype.forEach.call(document.querySelectorAll('[data-v]'),function(b){b.classList.toggle('active',b.getAttribute('data-v')===v)});
}
Array.prototype.forEach.call(document.querySelectorAll('[data-v]'),function(b){b.onclick=function(){view(b.getAttribute('data-v'))}});
document.getElementById('reset').onclick=function(){view('front')};
document.getElementById('zones').onchange=function(){zoneGroup.visible=this.checked};
document.getElementById('wire').onchange=function(){if(model)model.traverse(function(o){if(o.isMesh)o.material.wireframe=document.getElementById('wire').checked})};
window.addEventListener('resize',function(){camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight)});
(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();
})();
</script>
</body></html>
